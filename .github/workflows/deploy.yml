name: Deploy

# Migrations and deploys only ever run here (overview O7). Vercel's Git auto-deploys are off.
# - push to main      → staging (preview build, aliased to STAGING_DOMAIN, Neon "staging" branch)
# - manual dispatch   → production (Neon "production" branch)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Vercel promotes a new project's first deployment to production whatever its target,
      # so staging deploys only start once a production deployment exists.
      - name: Guard - a production deployment must exist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          team=""
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then team="&teamId=$VERCEL_ORG_ID"; fi
          count=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=1$team" \
            | jq '.deployments | length')
          if [[ "$count" -eq 0 ]]; then
            echo "No production deployment exists yet. Run Deploy (workflow_dispatch) for production first." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set git author for Vercel
        run: |
          git config user.email "${{ vars.VERCEL_EMAIL }}"
          git config user.name "GitHub Actions"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel environment
        run: vercel pull --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }}

      - uses: ariga/setup-atlas@v0

      # Runs before the build and stops the job on failure, so every migration must stay
      # compatible with the code that is currently live (expand/contract).
      - name: Apply migrations (staging)
        uses: ariga/atlas-action/migrate/apply@v1
        with:
          dir: file://db/migrations
          url: ${{ secrets.DATABASE_URL_UNPOOLED }}
          revisions-schema: public

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # `vercel alias` fails with team-scoped tokens, so alias through the API.
      - name: Alias to the staging domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          team=""
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then team="?teamId=$VERCEL_ORG_ID"; fi
          host="${DEPLOYMENT_URL#https://}"
          id=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$host$team" | jq -r '.id')
          curl -fsS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"alias\":\"$STAGING_DOMAIN\"}" \
            "https://api.vercel.com/v2/deployments/$id/aliases$team"
          echo "Deployed $DEPLOYMENT_URL → https://$STAGING_DOMAIN"

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set git author for Vercel
        run: |
          git config user.email "${{ vars.VERCEL_EMAIL }}"
          git config user.name "GitHub Actions"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel environment
        run: vercel pull --environment=production --yes --token=${{ secrets.VERCEL_TOKEN }}

      - uses: ariga/setup-atlas@v0

      - name: Apply migrations (production)
        uses: ariga/atlas-action/migrate/apply@v1
        with:
          dir: file://db/migrations
          url: ${{ secrets.DATABASE_URL_UNPOOLED }}
          revisions-schema: public

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
